<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch & Earn Cash</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1f4068, #162447);
            color: #fff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            color: #e4e4e4;
        }
        .balance-card {
            background: #0f3460;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #e94560;
        }
        .balance-card h2 {
            font-size: 16px;
            color: #b2bec3;
            margin-bottom: 5px;
        }
        .balance-card p {
            font-size: 28px;
            font-weight: bold;
            color: #00d2d3;
        }
        .video-box {
            width: 100%;
            height: 200px;
            background: #000;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            border: 2px dashed #00d2d3;
        }
        .video-box p {
            color: #fff;
            text-align: center;
            padding: 10px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #e94560;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 10px;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn:disabled {
            background: #636e72;
            cursor: not-allowed;
        }
        .timer {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            color: #ffeaa7;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Watch & Earn Cash</h1>
        
        <div class="balance-card">
            <h2>Total Balance</h2>
            <p id="balance">$0.00</p>
        </div>

        <div class="video-box" id="videoContainer">
            <p>Click "Watch Video" to start earning!</p>
        </div>

        <button class="btn" id="watchBtn" onclick="startWatching()">Watch Video & Earn</button>
        <div class="timer" id="timerText"></div>
    </div>

    <script>
        let balance = 0.00;
        const watchBtn = document.getElementById('watchBtn');
        const videoContainer = document.getElementById('videoContainer');
        const balanceDisplay = document.getElementById('balance');
        const timerText = document.getElementById('timerText');

        function startWatching() {
            watchBtn.disabled = true;
            let countdown = 5; 
            videoContainer.innerHTML = `<p>Ad is playing... Please wait (${countdown}s)</p>`;

            let timer = setInterval(() => {
                countdown--;
                if (countdown > 0) {
                    videoContainer.innerHTML = `<p>Ad is playing... Please wait (${countdown}s)</p>`;
                } else {
                    clearInterval(timer);
                    balance += 0.05; 
                    balanceDisplay.innerText = `$${balance.toFixed(2)}`;
                    videoContainer.innerHTML = `<p>Reward added successfully! Great Job!</p>`;
                    watchBtn.disabled = false;
                    timerText.innerText = "";
                }
            }, 1000);
        }
    </script>
</body>
</html>

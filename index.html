<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch & Earn Cash</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: white;
            text-align: center;
            margin: 0;
            padding: 15px;
        }
        h2 { color: #38bdf8; margin-bottom: 5px; }
        .wallet-box {
            background: #1e293b;
            border: 2px solid #38bdf8;
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
        }
        .balance {
            font-size: 26px;
            font-weight: bold;
            color: #22c55e;
        }
        .withdraw-btn {
            background-color: #22c55e;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .search-box {
            margin: 15px 0;
        }
        input[type="text"] {
            width: 65%;
            padding: 10px;
            border-radius: 5px;
            border: none;
            font-size: 15px;
        }
        .search-btn {
            padding: 10px 12px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 15px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }
        .yt { background-color: #ff0000; }
        .tt { background-color: #000000; border: 1px solid #25f4ee; }
        .fb { background-color: #1877f2; }
        .video-container {
            margin-top: 15px;
            background: #1e293b;
            padding: 10px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <h2>Watch & Earn Cash</h2>
    <p>ویڈیوز دیکھیں اور پوائنٹس کمائیں!</p>

    <!-- Wallet & Withdrawal Section -->
    <div class="wallet-box">
        <p>آپ کا موجودہ بیلنس</p>
        <div class="balance" id="userBalance">$5.00</div>
        <button class="withdraw-btn" onclick="requestWithdraw()">EasyPaisa / JazzCash ودھڈرا کریں</button>
    </div>

    <!-- YouTube Search Bar -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="YouTube پر ویڈیو سرچ کریں...">
        <button class="search-btn" onclick="searchYouTube()">Search</button>
    </div>

    <!-- Direct Social Media Buttons -->
    <div class="social-buttons">
        <a href="https://www.youtube.com" target="_blank" onclick="addReward()" class="btn yt">YouTube</a>
        <a href="https://www.tiktok.com" target="_blank" onclick="addReward()" class="btn tt">TikTok</a>
        <a href="https://www.facebook.com" target="_blank" onclick="addReward()" class="btn fb">Facebook</a>
    </div>

    <!-- Player Container -->
    <div class="video-container" onclick="addReward()">
        <iframe width="100%" height="200" src="https://www.youtube.com/embed/tgbNymZ7vqY" frameborder="0" allowfullscreen></iframe>
        <p style="font-size: 12px; color: #94a3b8; margin-top: 5px;">فلم یا ویڈیو دیکھنے پر 2.00$ ملیں گے!</p>
    </div>

    <script>
        let currentBalance = 5.00; // شروع کا بیلنس $5

        function addReward() {
            currentBalance += 2.00; // ہر کلک پر $2.00 تیزی سے بڑھیں گے
            document.getElementById('userBalance').innerText = '$' + currentBalance.toFixed(2);
        }

        function searchYouTube() {
            let query = document.getElementById('searchInput').value;
            if(query) {
                addReward();
                window.open('https://www.youtube.com/results?search_query=' + encodeURIComponent(query), '_blank');
            }
        }

        function requestWithdraw() {
            let accountNo = prompt("اپنا EasyPaisa یا JazzCash اکاؤنٹ نمبر درج کریں:");
            if(accountNo) {
                alert("ودھڈرا کی درخواست کامیابی سے جمع ہو گئی ہے! آپ کی رقم منتقل کر دی جائے گی۔");
            }
        }
    </script>

</body>
</html>

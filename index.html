<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch & Earn Cash</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: white;
            text-align: center;
            margin: 0;
            padding: 15px;
        }
        h2 { color: #38bdf8; }
        .search-box {
            margin: 20px 0;
        }
        input[type="text"] {
            width: 70%;
            padding: 10px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
        }
        button {
            padding: 10px 15px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            display: inline-block;
        }
        .yt { background-color: #ff0000; }
        .tt { background-color: #000000; border: 1px solid #25f4ee; }
        .fb { background-color: #1877f2; }
        .video-container {
            margin-top: 20px;
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <h2>Watch & Earn Cash</h2>
    <p>ویڈیوز دیکھیں اور پوائنٹس حاصل کریں!</p>

    <!-- YouTube Search Bar -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="YouTube پر ویڈیو سرچ کریں...">
        <button onclick="searchYouTube()">Search</button>
    </div>

    <!-- Direct Social Media Buttons -->
    <div class="social-buttons">
        <a href="https://www.youtube.com" target="_blank" class="btn yt">YouTube</a>
        <a href="https://www.tiktok.com" target="_blank" class="btn tt">TikTok</a>
        <a href="https://www.facebook.com" target="_blank" class="btn fb">Facebook</a>
    </div>

    <!-- Player Container -->
    <div class="video-container" id="videoArea">
        <iframe id="ytPlayer" width="100%" height="220" src="https://www.youtube.com/embed/tgbNymZ7vqY" frameborder="0" allowfullscreen></iframe>
    </div>

    <script>
        function searchYouTube() {
            let query = document.getElementById('searchInput').value;
            if(query) {
                window.open('https://www.youtube.com/results?search_query=' + encodeURIComponent(query), '_blank');
            }
        }
    </script>

</body>
</html>
